
name: AutoHeal CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: Build image and run tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Compose environment
        run: |
          cp .env.example .env

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Build AutoHeal image
        run: docker compose build autoheal

      - name: Run unit and API tests in container
        run: |
          docker compose run \
            --build \
            --rm \
            --no-deps \
            -e WEBHOOK_SECRET=change-me \
            -e DATABASE_URL=sqlite:////tmp/autoheal-test.db \
            -e AI_ENABLED=false \
            -e OTEL_SDK_DISABLED=true \
            -e OTEL_METRICS_EXPORTER=none \
            -e OTEL_TRACES_EXPORTER=none \
            autoheal \
            python -m pytest -q -p no:cacheprovider

      - name: Show container status on failure
        if: failure()
        run: docker compose ps

      - name: Clean up
        if: always()
        run: |
          docker compose down --remove-orphans
          rm -f .env
