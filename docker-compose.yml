services:

  postgres:
    image: postgres:16
    container_name: autoheal-postgres

    environment:
      POSTGRES_DB: autoheal
      POSTGRES_USER: autoheal
      POSTGRES_PASSWORD: autoheal

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U autoheal -d autoheal"
        ]
      interval: 5s
      timeout: 5s
      retries: 10

    restart: unless-stopped


  ollama:
    image: ollama/ollama:latest
    container_name: autoheal-ollama

    ports:
      - "11434:11434"

    volumes:
      - ollama_data:/root/.ollama

    gpus: all

    restart: unless-stopped


  tempo:
    image: grafana/tempo:latest
    container_name: autoheal-tempo

    command:
      - "-config.file=/etc/tempo.yaml"

    volumes:
      - ./observability/tempo.yaml:/etc/tempo.yaml:ro
      - tempo_data:/data/tempo

    ports:
      - "3200:3200"

    restart: unless-stopped


  otel-collector:
    image: otel/opentelemetry-collector:0.158.0
    container_name: autoheal-otel

    command:
      - "--config=/etc/otelcol/config.yaml"

    volumes:
      - ./observability/otel-collector-config.yaml:/etc/otelcol/config.yaml:ro

    ports:
      - "4317:4317"
      - "4318:4318"
      - "8889:8889"

    depends_on:
      - tempo

    restart: unless-stopped


  prometheus:
    image: prom/prometheus:latest
    container_name: autoheal-prometheus

    command:
      - "--config.file=/etc/prometheus/prometheus.yml"

    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus_data:/prometheus

    ports:
      - "9090:9090"

    depends_on:
      - otel-collector
      - alertmanager

    restart: unless-stopped


  alertmanager:
    image: prom/alertmanager:latest
    container_name: autoheal-alertmanager

    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
      - "--storage.path=/alertmanager"

    volumes:
      - ./observability/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager

    ports:
      - "9093:9093"

    depends_on:
      - autoheal

    restart: unless-stopped


  grafana:
    image: grafana/grafana:latest
    container_name: autoheal-grafana

    ports:
      - "3000:3000"

    volumes:
      - grafana_data:/var/lib/grafana
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro

    depends_on:
      - prometheus
      - tempo
      - alertmanager

    restart: unless-stopped


  autoheal:
    build: .
    container_name: autoheal

    ports:
      - "8000:8000"

    env_file:
      - .env

    environment:
      DATABASE_URL: postgresql+psycopg2://autoheal:autoheal@postgres:5432/autoheal
      OLLAMA_URL: http://ollama:11434
      OTEL_ENDPOINT: http://otel-collector:4318

    depends_on:
      postgres:
        condition: service_healthy

      ollama:
        condition: service_started

      otel-collector:
        condition: service_started

    extra_hosts:
      - "host.docker.internal:host-gateway"

    restart: unless-stopped


volumes:

  postgres_data:

  ollama_data:

  prometheus_data:

  grafana_data:

  tempo_data:

  alertmanager_data: