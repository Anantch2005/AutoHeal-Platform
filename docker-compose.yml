services:

  postgres:
    image: postgres:16
    container_name: autoheal-postgres

    environment:
      POSTGRES_DB: autoheal
      POSTGRES_USER: autoheal
      POSTGRES_PASSWORD: autoheal

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U autoheal -d autoheal"
        ]
      interval: 5s
      timeout: 5s
      retries: 10

    restart: unless-stopped


  autoheal:
    build: .

    container_name: autoheal

    ports:
      - "8000:8000"

    env_file:
      - .env

    environment:
      DATABASE_URL: postgresql+psycopg2://autoheal:autoheal@postgres:5432/autoheal

    depends_on:
      postgres:
        condition: service_healthy

    extra_hosts:
      - "host.docker.internal:host-gateway"

    restart: unless-stopped


volumes:
  postgres_data: