global:
  scrape_interval: 15s
  evaluation_interval: 15s


rule_files:
  - /etc/prometheus/rules/*.yml


alerting:

  alertmanagers:

    - static_configs:

        - targets:
            - alertmanager:9093


scrape_configs:

  - job_name: autoheal-otel

    static_configs:

      - targets:
          - otel-collector:8889